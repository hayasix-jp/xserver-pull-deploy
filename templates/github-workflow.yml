# xserver-pull-deploy — build on GitHub, let the server PULL and publish it.
# エックスサーバーの「国外アクセス制限（SSH）」は ON のまま使えます。GitHub にはサーバーの鍵もパスワードも置きません。
# Generated by `xpd init`. Docs: https://github.com/hayasix-jp/xserver-pull-deploy/blob/main/docs/ja/github.md
#
# Flow: build → bundle → one orphan commit on the deploy branch → POST /_deploy/kick.php → the server's pull.sh
#       fetches, verifies (sha256 + content checks) and publishes → this job waits for /_deploy/live.json → verify.
# Run workflow inputs: ref (commit/tag to publish; empty = latest) · force (publish even if the build has less than
# half the pages) · overwrite (skip the lineage check) · rollback ("previous" or a release ID: no build).
# Repository variable XPD_VERIFY: "true" = verify failures fail the run · "false" = skip verify · unset = warn only.
name: Deploy

on:
  push:
    branches: [__BRANCH__]
  workflow_dispatch:
    inputs:
      ref:
        description: '公開するコミット / タグ（空 = __BRANCH__ の最新）'
        required: false
        default: ''
      force:
        description: 'ページ数が公開中の半分未満でも公開する'
        type: boolean
        default: false
      overwrite:
        description: '系譜チェックを無視する（古いコミットを意図的に公開するとき）'
        type: boolean
        default: false
      rollback:
        description: 'previous またはリリース ID（入力するとビルドせずに切り戻し）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # the deploy branch and the status branch
    # One publish at a time: a waiting run is replaced by a newer one, a running publish is never cancelled.
    concurrency:
      group: xserver-pull-deploy
      cancel-in-progress: false
    env:
      # How to run xserver-pull-deploy in this repository (installed as a devDependency, or vendored).
      XPD: __XPD__
      DEPLOY_BRANCH: __DEPLOY_BRANCH__
      STATUS_BRANCH: __STATUS_BRANCH__
      ROLLBACK: ${{ inputs.rollback || '' }}
      OVERWRITE: ${{ inputs.overwrite && 'true' || 'false' }}
      FORCE: ${{ inputs.force && 'true' || 'false' }}
      XPD_TRIGGER: ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }}
      XPD_VERIFY: ${{ vars.XPD_VERIFY || 'warn' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Inputs
        id: start
        run: |
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
          case "$ROLLBACK" in "" | previous) ;; *[!0-9-]*) echo "::error::rollback は previous か リリース ID（数字と -）です: $ROLLBACK"; exit 1 ;; esac

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          # The write token is NOT left in .git/config: the dependency install and the build run code from npm,
          # which must not be able to push. Only the two push steps below get the token (as GH_TOKEN).
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Also installs xpd itself when it is a devDependency (every later step runs $XPD).
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f package.json ]; then npm install --no-audit --no-fund
          fi

      # status.json on the status branch (the server copies it into /_deploy/pull.json → the status widget).
      # Best effort: a failed status write never fails the publish.
      - name: Status building
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/status.sh" <<'EOF'
          # status.sh <building|success|failed> [message]
          set -u
          msg=$(printf '%s' "${2:-}" | tr -d '"\\<>' | tr '\r\n\t' '   ' | cut -c 1-300)
          d=$(mktemp -d)
          jq -nc --arg s "$1" --arg c "$(git rev-parse HEAD)" --arg u "$RUN_URL" --arg m "$msg" \
            --arg at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            '{state:$s, commit:$c, run_url:$u, message:$m, at:$at}' > "$d/status.json"
          # the token reaches git through the environment (GIT_CONFIG_*), never on a command line (process list)
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          ( cd "$d" && git init -q -b "$STATUS_BRANCH" && git add status.json \
            && git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "status: $1" \
            && git push -qf "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$STATUS_BRANCH" ) \
            || echo "::warning::$STATUS_BRANCH の更新に失敗しました（公開は続けます）"
          rm -rf "$d"
          EOF
          sh "$RUNNER_TEMP/status.sh" building

      # What is live must be an ancestor of what we publish — otherwise something published from a PC that GitHub
      # does not have would silently disappear.
      - name: Lineage check
        if: env.ROLLBACK == ''
        run: |
          if [ "$OVERWRITE" = true ]; then echo "::warning::overwrite: 系譜チェックを飛ばします"; exit 0; fi
          $XPD lineage --ci

      # Hugo / Jekyll / other toolchains: add their setup step here (for example peaceiris/actions-hugo).
      # The build command itself comes from xpd.config.json ("build").

      - name: Build and bundle
        if: env.ROLLBACK == ''
        run: |
          set -o pipefail
          $XPD bundle-only --out .xpd-bundle $([ "$FORCE" = true ] && echo --force) 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Rollback request
        if: env.ROLLBACK != ''
        run: $XPD bundle-only --out .xpd-bundle --rollback "$ROLLBACK"

      # The deploy branch is always exactly one orphan commit: the latest bundle (or rollback request), force-pushed.
      # Pushes made with GITHUB_TOKEN never start another workflow run.
      - name: Hand over (deploy branch)
        id: handover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          src=$(git rev-parse HEAD)
          cd .xpd-bundle
          git init -q -b "$DEPLOY_BRANCH" && git add -A
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "deploy ${src:0:12}${ROLLBACK:+ rollback $ROLLBACK} ($XPD_TRIGGER)"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push -qf "https://github.com/$GITHUB_REPOSITORY" "HEAD:refs/heads/$DEPLOY_BRANCH"
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "$DEPLOY_BRANCH → $(git rev-parse --short=12 HEAD)"

      - name: Kick the server
        run: $XPD kick

      - name: Wait for the server
        env:
          DEPLOY_REF: ${{ steps.handover.outputs.ref }}
          STARTED: ${{ steps.start.outputs.started }}
        run: |
          if [ -n "$ROLLBACK" ]; then
            $XPD wait --rollback-since "$STARTED" --deploy-ref "$DEPLOY_REF" --timeout 360
          else
            $XPD wait --commit "$(git rev-parse HEAD)" --deploy-ref "$DEPLOY_REF" --timeout 360
          fi

      - name: Verify (live site)
        if: env.XPD_VERIFY != 'false'
        continue-on-error: ${{ vars.XPD_VERIFY != 'true' }}
        run: |
          if [ -n "$ROLLBACK" ]; then $XPD verify; else $XPD verify --commit "$(git rev-parse HEAD)" --fresh; fi

      - name: Status success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh "$RUNNER_TEMP/status.sh" success

      - name: Status failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/status.sh" ] || exit 0
          m=$(grep -m 1 -E '(\[ERROR\]|Error:|error:|ERR!|^x )' "$RUNNER_TEMP/build.log" 2>/dev/null | sed 's/\x1b\[[0-9;]*m//g' | cut -c 1-300)
          sh "$RUNNER_TEMP/status.sh" failed "${m:-公開に失敗しました（詳細は GitHub の実行ログ）}"

      - name: Status cancelled
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/status.sh" ] || exit 0
          sh "$RUNNER_TEMP/status.sh" failed "公開が途中で取り消されました"

      - name: Summary
        if: always()
        env:
          DEPLOY_REF: ${{ steps.handover.outputs.ref }}
        run: |
          {
            echo "### Deploy"
            echo ""
            echo "| | |"
            echo "|---|---|"
            if git rev-parse HEAD >/dev/null 2>&1; then
              echo "| commit | \`$(git rev-parse --short=12 HEAD)\` $(git log -1 --format=%s | sed 's/|/\\|/g') |"
            fi
            echo "| trigger | $XPD_TRIGGER${ROLLBACK:+ · rollback $ROLLBACK} |"
            echo "| deploy branch | ${DEPLOY_REF:0:12} |"
            echo "| result | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
